# Blueprint de Render (https://render.com/docs/blueprint-spec). La base de datos es Neon
# (PostgreSQL gestionado, cifrado en reposo); su cadena de conexión se carga a mano en DATABASE_URL.
# Ver DESPLIEGUE.md.
services:
  - type: web
    name: sigo-dental
    runtime: docker
    plan: starter            # el plan gratuito "duerme" y no admite disco persistente
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false        # se despliega a mano tras revisar la integración continua
    disk:                    # radiografías y documentos (ARCHIVOS_DIR). Ver DESPLIEGUE.md §5.
      name: archivos
      mountPath: /data/archivos
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL    # Neon: postgres://...neon.tech/sigo?sslmode=require
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_ADDR
        fromService:
          type: keyvalue
          name: sigo-redis
          property: hostport
      - key: WEB_ORIGIN      # https://<su-servicio>.onrender.com o el dominio propio
        sync: false
      - key: CLINIC_TIMEZONE # zona IANA de la clínica, p. ej. America/Guayaquil
        sync: false
      - key: CLINIC_NAME
        sync: false
      - key: MESSAGING_PROVIDER
        value: simulated
  - type: keyvalue
    name: sigo-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # sólo accesible desde la red privada de Render
